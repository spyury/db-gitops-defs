---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: appofapps
  namespace: openshift-gitops
spec:
  destination:
    name: ''
    namespace: openshift-gitops
    server: 'https://kubernetes.default.svc'
  source:
    path: overlays/az2-demo/0000-app-factory
    repoURL: 'git@github.com:spyury/db-gitops-apps.git'    
    targetRevision: v1.0.1-rc1
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
