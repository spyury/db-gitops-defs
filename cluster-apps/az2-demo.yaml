---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: appofapps
  namespace: openshift-gitops
spec:
  destination:
    name: ''
    namespace: openshift-gitops
    server: 'https://kubernetes.default.svc'
  source:
    path: overlays/az2-demo/app-factory
    repoURL: 'https://github.com/spyury/db-gitops-apps.git'
    
    targetRevision: main
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
