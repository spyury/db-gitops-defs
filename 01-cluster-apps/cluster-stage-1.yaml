---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: appofapps
  namespace: openshift-gitops
spec:
  destination:
    name: ''
    namespace: openshift-gitops
    server: 'https://kubernetes.default.svc'
  source:
    path: overlays/cluster-stage-1/app-factory
    repoURL: 'git@github.com:spyury/db-gitops-defs.git'    
    targetRevision: main
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
